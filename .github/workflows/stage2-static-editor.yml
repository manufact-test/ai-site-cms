name: Stage 2 static Jedison editor (internal CI only)
on:
  push:
    branches: [main]
    paths:
      - 'cms/editor/**'
      - '.github/workflows/stage2-static-editor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cms/editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned upstream Jedison, esbuild and Chromium driver
        run: npm ci --no-audit --no-fund
      - name: Verify exact npm lock and declared licensing
        run: npm run verify:deps && npm audit --audit-level=high
      - name: Build real self-contained static bundle
        run: npm run build
      - name: Verify real Chromium browser editor interactions
        run: npm run test:browser
      - name: Repeat deterministic clean asset build
        run: |
          test -s dist/editor.js && test -s dist/THIRD_PARTY_LICENSES.txt
          cp dist/editor.js /tmp/ai-site-cms-editor.js.first
          npm run build
          cmp /tmp/ai-site-cms-editor.js.first dist/editor.js
          grep -q 'German Bisurgi' dist/THIRD_PARTY_LICENSES.txt
      - name: Internal-only static JS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage2-jedison-static-ci-only
          path: |
            cms/editor/dist/editor.js
            cms/editor/dist/meta.json
            cms/editor/dist/THIRD_PARTY_LICENSES.txt
            cms/editor/dist/editor.js.LEGAL.txt
          if-no-files-found: error
          retention-days: 7
