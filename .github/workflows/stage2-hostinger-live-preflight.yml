name: Stage2 Hostinger real read-only PHP and isolated visitor preflight
# Explicit owner-granted READ ONLY on the TWO test domains only.
# Does not use SSH, database secrets, hosting APIs, deploys or write requests.
# Snapshot of pre-install condition. NOT CMS acceptance or outage test.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage2-hostinger-live-preflight.yml'
permissions:
  contents: read
jobs:
  owner-authorized-target-observation:
    if: github.repository == 'manufact-test/ai-site-cms'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only TLS-pinned exact target readiness and independent visitor checks
        shell: bash
        run: |
          node <<'JS'
          'use strict';
          const https=require('node:https');
          const dns=require('node:dns/promises');
          const fs=require('node:fs');
          const {publicIPv4}=require('./cms/tools/stage2-target-https-check.cjs');
          const CMS='lightseagreen-woodpecker-264491.hostingersite.com';
          const VISITOR='mediumpurple-fox-175549.hostingersite.com';
          const EXPECTED='stage2-target-host-check-20261020-r5';
          const pause=ms=>new Promise(done=>setTimeout(done,ms));
          function assert(check,reason){if(!check)throw Error(reason);}
          async function safeIp(host){
            const addresses=await dns.lookup(host,{family:4,all:true});
            assert(addresses.length>0&&addresses.every(a=>publicIPv4(a.address)),
              'Target DNS public IPv4 validation failed');
            return addresses[0].address;
          }
          function get(host,path,ip){
            return new Promise((resolve,reject)=>{
              let size=0,done=false;const chunks=[];
              const req=https.request({
                protocol:'https:',hostname:host,servername:host,port:443,
                method:'GET',path,agent:false,rejectUnauthorized:true,
                lookup:(_h,opts,cb)=>opts.all
                  ?cb(null,[{address:ip,family:4}]):cb(null,ip,4),
                headers:{'Accept':'application/json, text/html;q=0.9',
                  'Accept-Encoding':'identity','Cache-Control':'no-store',
                  'User-Agent':'AI-Site-CMS-Stage2-Owner-Approved-ReadOnly/1'}
              },res=>{
                const verified=res.socket.authorized===true;
                res.on('data',part=>{
                  size+=part.length;
                  if(size>65536){req.destroy(Error('Response too large'));return;}
                  chunks.push(part);
                });
                res.on('end',()=>{
                  if(done)return;done=true;
                  resolve({status:res.statusCode||0,
                    type:String(res.headers['content-type']||''),
                    verified,location:res.headers.location||null,
                    body:Buffer.concat(chunks).toString('utf8')});
                });
                res.on('error',reject);
              });
              req.setTimeout(5000,()=>req.destroy(Error('Read timeout')));
              req.on('error',e=>{if(!done){done=true;reject(e);}});
              req.end();
            });
          }
          async function main(){
            const [cmsIp,visitorIp]=await Promise.all([safeIp(CMS),safeIp(VISITOR)]);
            let probe=null;let deployObserved=false;
            // Bounded auto-deploy observation: GET only, no Hostinger API or SSH.
            for(let attempt=0;attempt<12;attempt++){
              try {
                probe=await get(CMS,'/__stage2/host',cmsIp);
                if(probe.verified&&probe.status===200&&
                  probe.type.toLowerCase().startsWith('application/json')&&
                  JSON.parse(probe.body).probeRevision===EXPECTED){
                  deployObserved=true;break;
                }
              }catch{}
              if(attempt<11)await pause(8000);
            }
            assert(deployObserved,'Hostinger automatic deployment revision not observed');
            const p=JSON.parse(probe.body);
            const checks=p.requirements;
            assert(p.format==='ai-site-cms-stage2-target-php-preflight-v1'&&
              p.observationOnly===true&&p.stage2Accepted===false&&
              p.stage3Authorized===false&&p.productionReady===false&&
              p.cmsInstalled===false&&p.databaseConnectionAttempted===false&&
              p.privateFilesystemVerified===false&&p.cmsVisitorOutageTested===false,
              'Non-authoritative target preflight shape');
            const liteSpeedObserved=p.phpSapi==='litespeed';
            process.stdout.write('Target safely reported PHP='+String(p.phpVersionMajorMinor).slice(0,8)+
              '; SAPI='+String(p.phpSapi).slice(0,30)+'; stage2_not_accepted=true\\n');
            assert(typeof p.phpVersionMajorMinor==='string'&&
              /^8\.[1-9]$/.test(p.phpVersionMajorMinor)&&
              ['fpm-fcgi','cgi-fcgi','apache2handler','litespeed'].includes(p.phpSapi),
              'Target PHP ABI below Stage2 baseline or unexpected web SAPI');
            assert(checks&&Object.values(checks).every(v=>typeof v==='boolean')&&
              checks.php81OrLater&&checks.json&&checks.pdo&&checks.pdoMysql&&
              checks.openssl&&(checks.webSapi||liteSpeedObserved),
              'Target PHP dependency check failed');
            process.stdout.write('Target boolean capabilities: '+
              JSON.stringify({
                documentRootMatchesPublic:checks.documentRootMatchesPublicEntrypoint,
                separateParentReadable:checks.privateParentExistsAndReadable,
                separateParentAppearsWritable:checks.privateParentAppearsWritable,
                httpsVisibleInPhp:checks.httpsVisibleToPhp,
                pdoMysql:checks.pdoMysql,
                openssl:checks.openssl
              })+'\\n');
            const requests=[
              ['LiteSpeed nested front-controller route','/__stage2/rewrite/proof',r=>{
                if(r.status!==200||!r.type.toLowerCase().startsWith('application/json'))return false;
                try{
                  const v=JSON.parse(r.body);
                  return v.format==='ai-site-cms-stage2-routing-observation-v1'&&
                    v.probeRevision===EXPECTED&&v.exactNonFileRoute===true&&
                    v.frontControllerMapped===true&&v.installationReady===false&&
                    v.privateStorageVerified===false&&v.databaseConnected===false&&
                    v.stage2Accepted===false;
                }catch{return false;}
              }],
              ['Outside-webroot sibling marker (optional until second Git deployment)','/__stage2/private-boundary',r=>{
                if(![200,503].includes(r.status)||!r.type.toLowerCase().startsWith('application/json'))return false;
                try{
                  const d=JSON.parse(r.body);
                  return d.format==='ai-site-cms-stage2-private-boundary-observation-v1'&&
                    d.probeRevision===EXPECTED&&
                    typeof d.outsideThisPublicRootMarkerObserved==='boolean'&&
                    (r.status===200)===d.outsideThisPublicRootMarkerObserved&&
                    d.cmsInstalled===false&&d.privateCmsCodeInstalled===false&&
                    d.peerAccountIsolationVerified===false&&
                    d.databaseConnected===false&&d.stage2Accepted===false;
                }catch{return false;}
              }],
              ['Private marker not HTTP exposed','/cms-stage2-private-boundary/probe.json',r=>[403,404].includes(r.status)],
              ['Compiled offweb package integrity (optional until separate installation)','/__stage2/offweb-package',r=>{
                if(![200,503].includes(r.status)||!r.type.toLowerCase().startsWith('application/json'))return false;
                try{
                  const v=JSON.parse(r.body);
                  const full=v.state==='verified_unsigned_package'&&
                    v.offwebPackageIntegrityVerified===true&&
                    Number.isInteger(v.verifiedFiles)&&v.verifiedFiles>=20&&v.verifiedFiles<=1200;
                  const absent=['absent','incomplete'].includes(v.state)&&
                    v.offwebPackageIntegrityVerified===false&&v.verifiedFiles===0;
                  return v.format==='ai-site-cms-stage2-offweb-package-observation-v1'&&
                    v.probeRevision===EXPECTED&&
                    ((r.status===200&&full)||(r.status===503&&absent))&&
                    v.signatureVerified===false&&v.phpFromPackageExecuted===false&&
                    v.databaseConnected===false&&v.cmsInstalled===false&&
                    v.peerAccountIsolationVerified===false&&v.productionReady===false&&
                    v.stage2Accepted===false;
                }catch{return false;}
              }],
              ['No public access to offweb CMS manifest','/cms-stage2-offweb-runtime/private/package-manifest.json',r=>[403,404].includes(r.status)],
              ['Private PHP vendor','/vendor/autoload.php',r=>[403,404].includes(r.status)],
              ['Private editor','/private/editor/editor.js',r=>[403,404].includes(r.status)],
              ['Hidden Git configuration','/.git/config',r=>[403,404].includes(r.status)],
              ['No CMS publish endpoint','/api/publish',r=>r.status===404],
              ['Uninstalled CMS health','/api/health',r=>[503,404].includes(r.status)]
            ];
            const results=[];
            for(const [name,path,passes] of requests){
              const r=await get(CMS,path,cmsIp);
              assert(r.verified&&!r.location&&passes(r),
                'Public CMS route safety gate failed: '+name);
              results.push({name,status:r.status});
            }
            const visitor1=await get(VISITOR,'/',visitorIp);
            const visitor2=await get(VISITOR,'/',visitorIp);
            assert([visitor1,visitor2].every(r=>r.verified&&r.status===200&&
              !r.location&&r.type.toLowerCase().startsWith('text/html')&&r.body.length>0),
              'Independent visitor URL not accessible');
            const summary=[
              '## Live Stage 2 Hostinger pre-install evidence',
              '',
              '- Checked ONLY the two owner-authorized test domains with pinned public DNS and TLS-validating **GET**.',
              '- Hostinger Git auto-deployment revision observed: **YES**.',
              '- Web PHP: **'+p.phpVersionMajorMinor+'**; SAPI: **'+p.phpSapi+'**.',
              '- PHP 8.1+/JSON/PDO MySQL/OpenSSL: **YES**.',
              '- LiteSpeed LSAPI alternative to lab PHP-FPM: **'+(liteSpeedObserved?'DETECTED, NOT YET ACCEPTED':'not detected')+'**.',
              '- DocumentRoot matches PHP public script directory: **'+
                (checks.documentRootMatchesPublicEntrypoint?'YES':'NO — inspect')+'**.',
              '- Non-public parent can be read: **'+(checks.privateParentExistsAndReadable?'YES':'NO')+'**.',
              '- Non-public parent appears writable (not a real write test): **'+
                (checks.privateParentAppearsWritable?'YES':'NO')+'**.',
              '- PHP process sees HTTPS (TLS is independently checked by this runner): **'+
                (checks.httpsVisibleToPhp?'YES':'NO')+'**.',
              '- CMS not installed; MySQL NOT connected; private filesystem and outage NOT verified.',
              '- Stage2 acceptance: **NO**; independent legal review: **OPEN**.',
              '',
              '| HTTP route | Status |',
              '|---|---:|',
              ...results.map(r=>'| '+r.name+' | '+r.status+' |'),
              '| Visitor / before and after checks | 200 / 200 |'
            ].join('\n')+'\n';
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary);
            process.stdout.write('Stage2 live preflight PASS: auto-deploy revision, real PHP, private HTTP boundaries and independent visitor read-only reachability. No CMS/DB install or outage verified.\n');
          }
          main().catch(e=>{
            // Do not print raw transport responses, network addresses or credentials.
            const allowed=['Hostinger automatic deployment revision not observed',
              'Non-authoritative target preflight shape',
              'Target PHP ABI below Stage2 baseline or unexpected web SAPI',
              'Target PHP dependency check failed',
              'Independent visitor URL not accessible'];
            const msg=allowed.includes(e.message)||e.message.startsWith('Public CMS route safety gate failed')
              ?e.message:'Target connectivity/TLS/response safety check failed';
            process.stderr.write('STAGE2_LIVE_HOST_NOT_ACCEPTED: '+msg+'\n');
            process.exitCode=3;
          });
          JS
