name: Stage 1 editor research (non-production)
on:
  push:
    branches:
      - research/stage1-editor-comparison
    paths:
      - 'research/stage1/**'
      - '.github/workflows/stage1-editor-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: research/stage1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned research dependencies
        run: npm install --no-audit --no-fund
      - name: Reviewed site capability packs - live link, disclosure, dialog and preview-only form
        run: node trusted-behavior-browser.cjs
      - name: Install explicit media fixture toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Real local media and upload adversarial boundaries
        run: command -v ffmpeg && node media-fixtures.cjs
      - name: Typed AI-site AST profiles and adversarial contracts
        run: node typed-ast-probe.cjs
      - name: Five AI-authored section families with upstream Jedison/RJSF and native media
        run: node multi-section-browser.cjs
      - name: Annotated HTML discovery, stable IDs and computed CSS across devices
        run: node annotated-html-browser.cjs
      - name: Native Jedison and RJSF responsive field edits drive computed CSS
        run: node annotated-editor-css.cjs
      - name: Audit manifest coverage against external editable intent
        run: node annotated-coverage-audit.cjs
      - name: Trusted extensible CSS packs, schema parity, hostile fragments and migrations
        run: node registry-hardening.cjs
      - name: Uninstrumented AI-site contract preflight, unsupported components and migrations
        run: node independent-site-preflight.cjs
      - name: Mapped standalone site safe-content HTML/PHP/React parity
        run: node independent-site-render-parity.cjs
      - name: Full-site opaque browser trust boundary, CSS and blocked behaviors
        run: node independent-site-sandbox.cjs
      - name: Native browser editor test of new geometry and appearance property packs
        run: node registry-editor-browser.cjs
      - name: Adversarial HTML grammar and native nonce/origin preview boundary
        run: node html-boundary-adversarial.cjs
      - name: Diagnose complex adapter native bootstrap first
        run: node complex-adapters.cjs
      - name: Run actual upstream package checks
        run: node srcdoc-bootstrap.cjs && npm test && node secure-preview.cjs && node performance.cjs && node multirender.cjs && node rjsf-custom.cjs && node schema-parity.cjs && node override-evolution.cjs && node representative-hero.cjs && node public-runtime.cjs
      - name: Matched complex editor sessions
        run: node matched-editor-session.cjs && STAGE1_EDITOR_ORDER=reverse node matched-editor-session.cjs
      - name: Matched custom widgets and media mock preview
        run: node matched-custom-media.cjs
      - name: PHP-only typed validation research
        run: php -v && php php-validation-smoke.php
      - name: Actual Opis JSON Schema 2.6.0 research
        run: composer --version && composer install --no-interaction --prefer-dist --no-progress && php opis-schema-smoke.php && php schema-parity.php && node publish-rollback.cjs
      - name: Reviewed visual gradient, animation and SVG asset capabilities with upstream editors
        run: node reviewed-visual-asset-browser.cjs
  regeneration:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: research/stage1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned research dependencies
        run: npm install --no-audit --no-fund
      - name: Independently validate AI regeneration, owner overrides, explicit publish and rollback
        run: node versioned-site-reconciliation-browser.cjs

  durability:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: research/stage1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent PHP CLI persistent state, restart, corruption, CAS and recovery
        run: php -v && node durable-site-recovery.cjs

  mixed-site-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: research/stage1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned research dependencies
        run: npm install --no-audit --no-fund
      - name: Verify signed extension provenance and independent reviewed-permission gate
        run: node capability-provenance-threat.cjs
      - name: Full heterogeneous AI-regeneration view parity across HTML, PHP, React and real Next static export
        run: php -v && node heterogeneous-regeneration-parity.cjs
      - name: Novel standalone site source versus reviewer oracle and manifest omissions
        run: node novel-source-contract-audit.cjs
      - name: PHP persistent signed capability trust, restart, revocation and local rollback threat cases
        run: php -v && php -m | grep -i sodium && node persistent-capability-trust-test.cjs
      - name: Separately signed external witness versus full site rollback and two-volume replay
        run: php -v && node external-trust-witness.cjs
      - name: Chromium original rich-site CSS SEO media fidelity with unsafe JavaScript quarantined
        run: node cedar-rich-browser-boundary.cjs
      - name: Frozen paired source and manifest grading protocol with correlated missing-intent refusals
        run: node external-generator-contract-gate.cjs
      - name: Real browser reviewed behavior adapter restores typed navigation and safe form preview
        run: node reviewed-rich-behavior-browser.cjs
      - name: Original mixed-site HTML regeneration with reviewed owner CSS media content links, draft isolation and rollback in Chromium
        run: node rich-source-regeneration-browser.cjs
