name: Stage2 consented Hostinger HTTPS observation (READ ONLY)
# Owner explicitly authorized observation of ONLY these two empty test-site URLs
# on 2026-10-19. No files, databases, SSH, Hostinger APIs or write requests.
# This workflow is a one-time owner-scoped baseline on its initial commit.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage2-consented-hostinger-https.yml'
permissions:
  contents: read
jobs:
  permitted-https-baseline:
    if: github.repository == 'manufact-test/ai-site-cms'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact-host, read-only GET observer with expiring scope
        shell: bash
        env:
          CMS_ENV: production
          CMS_STAGE2_OWNER_READONLY_PERMISSION: owner-grant-recorded-read-only
          CMS_ORIGIN: https://lightseagreen-woodpecker-264491.hostingersite.com
          VISITOR_ORIGIN: https://mediumpurple-fox-175549.hostingersite.com
        run: |
          set -euo pipefail
          umask 077
          scope_dir="$(mktemp -d)"
          trap 'rm -rf "$scope_dir"' EXIT
          export SCOPE_FILE="$scope_dir/owner-scoped-readonly.json"
          node <<'JS'
          'use strict';
          const fs=require('node:fs');
          const stamp=ms=>new Date(Math.floor(ms/1000)*1000).toISOString().replace('.000Z','Z');
          const now=Date.now();
          fs.writeFileSync(process.env.SCOPE_FILE,JSON.stringify({
            format:'ai-site-cms-stage2-readonly-host-scope-v1',
            repository:'manufact-test/ai-site-cms',
            scope:'target-readonly-https-get',
            cmsOrigin:process.env.CMS_ORIGIN,
            siteOrigin:process.env.VISITOR_ORIGIN,
            reference:'owner-approved-readonly-20261019',
            issuedAt:stamp(now-60000),
            expiresAt:stamp(now+600000)
          })+'\n',{mode:0o600,flag:'wx'});
          JS
          set +e
          node cms/tools/stage2-target-https-check.cjs \
            --check --operator-attests-readonly-grant \
            "--cms-origin=$CMS_ORIGIN" "--site-origin=$VISITOR_ORIGIN" \
            "--scope-file=$SCOPE_FILE" > "$RUNNER_TEMP/stage2-target-https.json"
          result=$?
          set -e
          node - "$RUNNER_TEMP/stage2-target-https.json" "$result" <<'JS'
          'use strict';
          const fs=require('node:fs');
          const [file,codeArg]=process.argv.slice(2);
          const code=Number(codeArg);
          const record=JSON.parse(fs.readFileSync(file,'utf8'));
          if(![0,4].includes(code)||record.format!=='ai-site-cms-stage2-active-https-observation-v1'
            ||record.stage2Accepted!==false||record.targetHostAccepted!==false
            ||record.requestsRestrictedToGet!==true
            ||record.actualWebSapiVerified!==false||record.dbConnectionVerified!==false)
            throw Error('Unexpected HTTPS observer result: refuse to present as evidence');
          const checks=Object.entries(record.results||{});
          const summary=[
            '## Authorized Stage2 target HTTPS observations (read-only)',
            '',
            '- Owner-scoped to exactly two empty test domains; bounded to five GET requests.',
            '- No Hostinger SSH/API/filesystem/DB access, no writes, installs or outages.',
            '- These domains are currently **pre-install**; CMS health is not expected to pass.',
            '- Stage2 accepted: **NO**. Host filesystem/FPM/DB and legal review: **NOT VERIFIED**.',
            '- All HTTPS checks passed: **'+(record.httpsObservationsPass?'YES':'NO')+'**.',
            '- External requests attempted: **'+(record.actualHttpsRequestsAttempted?'YES':'NO')+'**.',
            '',
            '| Route | HTTP status | TLS verified | Stage2 expectation satisfied |',
            '|---|---:|---|---|',
            ...checks.map(([name,r])=>'| '+name+' | '+(r.status??'unavailable')+
              ' | '+(r.tlsPeerVerified?'YES':'NO')+' | '+(r.passed?'YES':'NO')+' |'),
            '',
            '> Lab check is NOT owner acceptance or verification of installed CMS.'
          ].join('\n')+'\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary);
          if(!record.actualHttpsRequestsAttempted||checks.length===0)
            throw Error('No usable public HTTPS observation; Stage2 host gate remains open');
          if(!record.httpsObservationsPass)
            process.stdout.write('Observed pre-install host state: NOT ready for Stage2 CMS routing (expected before deployment).\n');
          else process.stdout.write('HTTPS observations pass; Stage2 still not accepted.\n');
          JS
      - name: Preserve non-secret observer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-consented-hostinger-https-evidence
          path: ${{ runner.temp }}/stage2-target-https.json
          if-no-files-found: ignore
          retention-days: 7
