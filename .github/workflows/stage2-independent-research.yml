name: Stage2 independent parallel research verification (NO HOST)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage2-independent-research.yml'
      - 'research/parallel-security/**'
      - 'research/parallel-components/**'
  pull_request:
    paths:
      - 'research/parallel-security/**'
      - 'research/parallel-components/**'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  research-pr-scope:
    name: Verify exact PR head and research-only file scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse wrong branch, mixed changes or SHA drift
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          case "$BRANCH" in
            research/stage2-supply-chain*) prefix=research/parallel-security/ ;;
            research/editor-component-patterns) prefix=research/parallel-components/ ;;
            *) echo 'REFUSED: unsupported research branch' >&2; exit 1 ;;
          esac
          git diff --name-only "$BASE...HEAD" > "$RUNNER_TEMP/research-changed.txt"
          test -s "$RUNNER_TEMP/research-changed.txt"
          if grep -Ev "^$prefix" "$RUNNER_TEMP/research-changed.txt"; then
            echo 'REFUSED: candidate changes outside assigned research area' >&2
            exit 1
          fi
          echo 'Exact PR head and research-only scope proven.'
  security:
    needs: research-pr-scope
    if: >-
      always() &&
      (github.event_name != 'pull_request' || needs.research-pr-scope.result == 'success') &&
      (github.event_name != 'pull_request' || startsWith(github.head_ref, 'research/stage2-supply-chain'))
    name: Security research actual locks, installed sources, crypto
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout currently approved main as disposable integration base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          path: project
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact Security PR commit (NO write credentials)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Prove candidate file scope at exact PR SHA
        if: github.event_name == 'pull_request'
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          git diff --name-only ${{ github.event.pull_request.base.sha }}...HEAD > "$RUNNER_TEMP/security-changed.txt"
          test -s "$RUNNER_TEMP/security-changed.txt"
          if grep -Ev '^research/parallel-security/' "$RUNNER_TEMP/security-changed.txt"; then
            echo 'REFUSED: Security PR edits outside allowed research folder'
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git rev-parse HEAD
          echo 'Security PR changes restricted to research/parallel-security/'
      - name: Test exact PR candidate overlay against approved base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project/research
          rm -rf project/research/parallel-security
          cp -a candidate/research/parallel-security project/research/parallel-security
          echo 'EXACT PR candidate copied; no stale accepted-main substitution.'
          echo 'No GitHub writes, Hostinger or production deployment'
      - name: Install pinned Node 22 and PHP 8.3 for disposable CI only
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install original pinned build-only dependencies from current main
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          (cd cms && composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader)
          (cd cms/editor && npm ci --no-audit --no-fund && npm run build)
          (cd cms && node tools/build-internal-package.cjs)
      - name: Run independent Security suite with transparent failure classification
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          set +e
          node research/parallel-security/run-security-suite.mjs > "$RUNNER_TEMP/security-results.json"
          suite_status=$?
          set -e
          node - "$RUNNER_TEMP/security-results.json" <<'DEBUG'
          const fs=require('node:fs');
          const report=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          for(const result of report.results){
            if(result.status==='failed')console.log(JSON.stringify({
              failed:result.name,exitCode:result.exitCode,
              message:(result.stderr||result.validationError||result.stdout||'').slice(-1300)
            }));
          }
          console.log('EXECUTED_TESTS',report.counts);
          DEBUG
          test "$suite_status" -eq 0
          node - "$RUNNER_TEMP/security-results.json" <<'JS'
          const fs=require('node:fs');
          const report=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const names=new Map(report.results.map(x=>[x.name,x]));
          const required=[
            'actual-lock:json','actual-lock:csv','actual-lock:provenance',
            'npm:installed-source-notices','composer:actual-bundled-NOTICE',
            'native:RFC8032','native:signed-envelope',
            'mutation:policy-regression.mjs','mutation:provenance-regression.mjs',
            'mutation:notice-regression.mjs'
          ];
          // PR follow-up must run its signed receipt/permit/settlement and
          // trust-rotation suites against the exact candidate overlay. A green
          // aggregate with those rows BLOCKED or absent is not verification.
          if(process.env.GITHUB_EVENT_NAME==='pull_request'){
            required.push(
              'native:operator-receipt-chain',
              'native:operator-preactivation-permit',
              'native:operator-settlement-chain',
              'native:trust-root-rotation',
              'source:common-ed25519-backend',
              'native:forced-class-signed-chain',
              'mutation:evidence-readiness-regression.mjs'
            );
          }
          for(const name of required){
            const result=names.get(name);
            if(result?.status!=='passed')throw Error('Independent research gate failed: '+name+' '+(result?.status||'absent'));
          }
          if(report.counts.failed!==0||report.allExecutedTestsPassed!==true||
            report.stage2Accepted!==false||report.productionApproved!==false||
            report.licenseApproved!==false)
            throw Error('Unacceptable security suite conclusion');
          console.log(JSON.stringify({
            evidence:'Independent actual-head research, original lock/vendor/NOTICE and real native crypto',
            executedPass:report.counts.passed,failed:report.counts.failed,
            explicitlyBlocked:report.results.filter(x=>x.status==='blocked').map(x=>x.name),
            stage2Accepted:false,productionApproved:false
          },null,2));
          JS
      - name: Confirm no actual shared-host or DB work occurred
        run: echo 'This isolated job does not connect to Hostinger or approve Stage2.'

  components:
    needs: research-pr-scope
    if: >-
      always() &&
      (github.event_name != 'pull_request' || needs.research-pr-scope.result == 'success') &&
      (github.event_name != 'pull_request' || github.head_ref == 'research/editor-component-patterns')
    name: Components research actual PHP, HTTP, Chromium and schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout currently approved main as disposable integration base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          path: project
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact Components PR commit (NO write credentials)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Prove candidate file scope at exact PR SHA
        if: github.event_name == 'pull_request'
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          git diff --name-only ${{ github.event.pull_request.base.sha }}...HEAD > "$RUNNER_TEMP/components-changed.txt"
          test -s "$RUNNER_TEMP/components-changed.txt"
          if grep -Ev '^research/parallel-components/' "$RUNNER_TEMP/components-changed.txt"; then
            echo 'REFUSED: Components PR edits outside allowed research folder'
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git rev-parse HEAD
          echo 'Components PR changes restricted to research/parallel-components/'
      - name: Test exact PR candidate overlay against approved base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project/research
          rm -rf project/research/parallel-components
          cp -a candidate/research/parallel-components project/research/parallel-components
          echo 'EXACT PR candidate copied; no stale accepted-main substitution.'
          echo 'No GitHub writes, Hostinger or production deployment'
      - name: PHP 8.3 from target runtime family
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Exact local research PHP syntax and concurrency tests
        shell: bash
        working-directory: project/research/parallel-components
        run: |
          set -euo pipefail
          for file in lab/src/*.php lab/public/*.php lab/tests/*.php; do php -l "$file"; done
          for file in lab/tests/*-tests.php; do php "$file"; done
      - name: Python 3.13 disposable test runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pin developer-only image/schema/browser test packages
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.57.0' 'jsonschema==4.26.0' 'pillow==12.3.0'
          python -m playwright install --with-deps chromium
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*/chrome-linux*/chrome' -print -quit)"
          test -n "$CHROME" && test -x "$CHROME"
          sudo ln -sfn "$CHROME" /usr/bin/chromium
          /usr/bin/chromium --version
      - name: Independent isolated PHP localhost HTTP, schema, real Chromium and media tests
        shell: bash
        working-directory: project/research/parallel-components
        run: |
          set -euo pipefail
          for module in test_adapter_capabilities.py test_capabilities.py test_http.py test_http_configured.py test_media_assets.py test_schema.py test_browser.py; do
            echo "Research validation: $module"
            python -m unittest discover -s lab/tests -p "$module" -v
          done
          echo 'Research fixture validation PASS. No live inbox, external phone metadata, production media pipeline, or Stage3 approval.'
