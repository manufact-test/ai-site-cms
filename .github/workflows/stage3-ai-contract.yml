name: Stage 3 isolated AI site contract (NO DEPLOY)
on:
  push:
    branches: ['feature/stage3-ai-site-contract']
    paths:
      - 'stage3/**'
      - '!stage3/docs/**'
      - '!stage3/README.md'
      - '.github/workflows/stage3-ai-contract.yml'
  workflow_dispatch:
# Only the latest commit in this development branch needs the full browser/HTTP
# suite. Cancel superseded runs; never skip or weaken the final run.
concurrency:
  group: stage3-contract-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: stage3-ci-root
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: stage3_install_seed
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=stage3-ci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm isolated branch and no host permissions
        run: |
          test "$GITHUB_REF" = "refs/heads/feature/stage3-ai-site-contract"
          test "${{ github.repository }}" = "manufact-test/ai-site-cms"
      - name: Syntax and single offline contract end-to-end
        run: |
          node --check stage3/sdk/contract.cjs
          node --check stage3/sdk/draft.cjs
          node --check stage3/sdk/design-graph-interop.cjs
          node --check stage3/bin/ai-site.cjs
          node --check stage3/tests/contract-smoke.cjs
          node --check stage3/tests/design-graph-interop-smoke.cjs
          node stage3/tests/contract-smoke.cjs
          node stage3/tests/seo-handoff-studio-smoke.cjs
          node stage3/tests/rich-text-editor-smoke.cjs
          node stage3/tests/structured-data-smoke.cjs
      - name: SEO Engine focused first-client contracts (offline only)
        run: |
          node stage3/seo-engine/tests/seo-hreflang-smoke.cjs
          node stage3/seo-engine/tests/seo-rendered-content-smoke.cjs
          node stage3/seo-engine/tests/seo-rendered-capture-smoke.cjs
          node stage3/seo-engine/tests/seo-workspace-crawl-smoke.cjs
          node stage3/seo-engine/tests/seo-first-client-coverage-smoke.cjs
          node stage3/seo-engine/tests/seo-operator-workspace-smoke.cjs
          node stage3/seo-engine/tests/first-site-live-evidence-pipeline-smoke.cjs
          node stage3/seo-engine/tests/public-https-capture-smoke.cjs
          node stage3/seo-engine/tests/seo-graph-authored-links-smoke.cjs
          node stage3/seo-engine/tests/php-html-capture-smoke.cjs
          node stage3/seo-engine/tests/php-local-delivery-readiness-smoke.cjs
          node stage3/seo-engine/tests/php-local-static-export-smoke.cjs
      - name: Verify standalone browser bundle matches contract SDK exactly
        run: |
          node --check stage3/studio/build.cjs
          node --check stage3/studio/app.js
          node stage3/studio/build.cjs --check
      - name: Install pinned existing Chromium test driver
        run: npm ci --prefix cms/editor --no-audit --no-fund
      - name: One real offline browser E2E for entire Stage 3 editor workflow
        run: node stage3/tests/studio-browser.cjs
      - name: PHP 8.3 isolated SQLite and MySQL runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, mbstring
          coverage: none
      - name: Read-only Hostinger PHP CLI environment probe
        run: |
          php -l stage3/server/bin/hosted-install-runner.php
          node --check stage3/tests/hosted-environment-probe.cjs
          node stage3/tests/hosted-environment-probe.cjs
      - name: Signed CMS engine update, rollback and database snapshot rehearsal
        env:
          STAGE3_INSTALL_MYSQL_HOST: 127.0.0.1
          STAGE3_INSTALL_MYSQL_PORT: 3306
          STAGE3_INSTALL_MYSQL_USER: root
          STAGE3_INSTALL_MYSQL_PASSWORD: stage3-ci-root
        run: |
          node --check stage3/bin/cms-release.cjs
          node --check stage3/tests/engine-update-smoke.cjs
          php -l stage3/server/EngineReleaseVerifier.php
          php -l stage3/server/EngineLifecycle.php
          php -l stage3/server/DatabaseSnapshot.php
          php -l stage3/server/EngineRuntime.php
          php -l stage3/server/bin/engine.php
          node stage3/tests/engine-update-smoke.cjs
      - name: D3 isolated release cutover and rollback on loopback
        run: |
          node --check stage3/runtime-export/bin/release-manager.cjs
          node --check stage3/runtime-export/tests/release-lab.cjs
          php -l stage3/runtime-export/templates/release-lab/router.php
          node stage3/runtime-export/tests/release-lab.cjs
          node --check stage3/runtime-export/lib/delivery-zip.cjs
          node --check stage3/runtime-export/bin/prepare-delivery.cjs
          node --check stage3/runtime-export/bin/package-handoff.cjs
          node --check stage3/runtime-export/bin/verify-delivery.cjs
          node --check stage3/runtime-export/bin/package-collector.cjs
          node --check stage3/runtime-export/bin/verify-collector.cjs
          node --check stage3/runtime-export/tests/collector-package.cjs
          node --check stage3/tests/install-probe.cjs
          node --check stage3/tests/mysql-install-probe.cjs
          node --check stage3/runtime-export/lib/delivery-preflight.cjs
          node --check stage3/runtime-export/bin/audit-delivery.cjs
          node --check stage3/runtime-export/bin/ship.cjs
          node --check stage3/runtime-export/bin/rehearse-delivery.cjs
          node stage3/runtime-export/tests/delivery-probe.cjs
      - name: Server syntax and one full HTTP persistence/publish E2E
        env:
          STAGE3_INSTALL_MYSQL_HOST: 127.0.0.1
          STAGE3_INSTALL_MYSQL_PORT: 3306
          STAGE3_INSTALL_MYSQL_USER: root
          STAGE3_INSTALL_MYSQL_PASSWORD: stage3-ci-root
        run: |
          for file in stage3/server/*.php stage3/server/public/*.php stage3/server/bin/*.php stage3/server/collector-public/*.php; do php -l "$file"; done
          node stage3/runtime-export/tests/collector-package.cjs
          node stage3/tests/install-probe.cjs
          node stage3/tests/mysql-install-probe.cjs
          php stage3/tests/smtp-config-smoke.php
          php stage3/tests/hosting-diagnostics-smoke.php
          php stage3/tests/graph-interactions-smoke.php
          php stage3/tests/archive-bundle-smoke.php
          node stage3/tests/server-e2e.cjs
          node --check stage3/studio/hosted.js
          node --check stage3/studio/access.js
          # Critical, fast real PHP/Chromium journey for one externally compiled site.
          # The original exhaustive hosted-browser.cjs remains available for manual extended regression.
          node stage3/tests/approved-site-browser.cjs
      - name: Apache 2.4 shared-host routing and Stage3 PHP HTTP smoke (no deployment)
        run: |
          node --check stage3/tests/shared-host-apache-smoke.cjs
          node stage3/tests/shared-host-apache-smoke.cjs
      - name: Package click-to-open offline editor (no secrets or server code)
        run: |
          mkdir -p stage3/studio/out
          cd stage3/studio
          zip -q out/ai-site-stage3-offline-studio.zip index.html studio.css bundle.js
      - name: Upload standalone Stage3 editable browser Studio ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ai-site-stage3-offline-studio
          path: stage3/studio/out/ai-site-stage3-offline-studio.zip
          retention-days: 7
          if-no-files-found: error
      - name: Build and verify Hostinger sibling-layout package (no deployment)
        run: |
          node --check stage3/bin/cms-release.cjs
          node --check stage3/tests/hostinger-package-smoke.cjs
          node stage3/tests/hostinger-package-smoke.cjs
          mkdir -p "$RUNNER_TEMP/hostinger-stage3-package"
          node stage3/bin/cms-release.cjs pack-hostinger-sibling "$GITHUB_WORKSPACE" "$RUNNER_TEMP/hostinger-stage3-package/release"
          node stage3/bin/cms-release.cjs verify "$RUNNER_TEMP/hostinger-stage3-package/release"
          cd "$RUNNER_TEMP/hostinger-stage3-package/release"
          zip -q -r "$RUNNER_TEMP/hostinger-stage3-package/ai-site-stage3-hostinger-sibling.zip" stage3 public_html cms-release.json
      - name: Upload Hostinger sibling-layout Stage3 package
        uses: actions/upload-artifact@v4
        with:
          name: ai-site-stage3-hostinger-sibling
          path: ${{ runner.temp }}/hostinger-stage3-package/ai-site-stage3-hostinger-sibling.zip
          retention-days: 7
          if-no-files-found: error
      - name: Build and verify FOX code-only update (NO DEPLOY)
        run: |
          mkdir -p "$RUNNER_TEMP/fox-stage3-code"
          node stage3/bin/cms-release.cjs pack-php-host "$GITHUB_WORKSPACE" "$RUNNER_TEMP/fox-stage3-code/release"
          node stage3/bin/cms-release.cjs verify-fox-code-only "$RUNNER_TEMP/fox-stage3-code/release"
          node stage3/bin/cms-release.cjs compare "$RUNNER_TEMP/hostinger-stage3-package/release" "$RUNNER_TEMP/fox-stage3-code/release"
          cmp "$RUNNER_TEMP/hostinger-stage3-package/release/cms-release.json" "$RUNNER_TEMP/fox-stage3-code/release/cms-release.json"
          mv "$RUNNER_TEMP/fox-stage3-code/release" "$RUNNER_TEMP/fox-stage3-code/fox-update-$GITHUB_SHA"
          cd "$RUNNER_TEMP/fox-stage3-code"
          # pack-php-host deliberately creates a private 0700/0600 worktree.
          # The manual Hostinger File Manager archive needs traversable 0755
          # directories and readable 0644 code files after extraction. It has
          # no installation-local private-config pointer or credentials.
          find "fox-update-$GITHUB_SHA" -type d -exec chmod 0755 {} +
          find "fox-update-$GITHUB_SHA" -type f -exec chmod 0644 {} +
          zip -q -r "ai-site-stage3-fox-code-$GITHUB_SHA.zip" "fox-update-$GITHUB_SHA"
          unzip -Z1 "ai-site-stage3-fox-code-$GITHUB_SHA.zip" > entries.txt
          grep -q "^fox-update-$GITHUB_SHA/stage3/" entries.txt
          ! grep -q "public_html" entries.txt
          mkdir -p "$RUNNER_TEMP/fox-stage3-code/unzip-audit"
          unzip -q "ai-site-stage3-fox-code-$GITHUB_SHA.zip" -d "$RUNNER_TEMP/fox-stage3-code/unzip-audit"
          extracted="$RUNNER_TEMP/fox-stage3-code/unzip-audit/fox-update-$GITHUB_SHA"
          test "$(stat -c '%a' "$extracted")" = '755'
          test "$(stat -c '%a' "$extracted/stage3")" = '755'
          test "$(stat -c '%a' "$extracted/stage3/server")" = '755'
          test "$(stat -c '%a' "$extracted/stage3/studio/bundle.js")" = '644'
          test "$(stat -c '%a' "$extracted/cms-release.json")" = '644'
          test ! -e "$extracted/stage3/server/private-config-path.json"
          test ! -e "$extracted/public_html"
          node "$GITHUB_WORKSPACE/stage3/bin/cms-release.cjs" verify-fox-code-only "$extracted"
      - name: Upload FOX runtime-only code artifact (manual update, no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: ai-site-stage3-fox-code-update
          path: ${{ runner.temp }}/fox-stage3-code/ai-site-stage3-fox-code-*.zip
          retention-days: 7
          if-no-files-found: error
      - name: Upload desktop and phone smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-site-stage3-editor-screens
          path: stage3/studio/out/*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Offline scenario without any design brief
        run: |
          node stage3/bin/ai-site.cjs create --id=site-no-mockup --title="No design brief" > "$RUNNER_TEMP/ai-site.json"
          node stage3/bin/ai-site.cjs validate "$RUNNER_TEMP/ai-site.json"
  technology-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Disposable Next Static real build and Next SSR loopback HTTP proof
        run: node stage3/runtime-export/tests/next-probe.cjs

  mariadb-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        version: ['10.11', '11.8']
    services:
      mariadb:
        image: mariadb:${{ matrix.version }}
        env:
          MARIADB_ROOT_PASSWORD: stage3-ci-root
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --su-mysql --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install PHP 8.3 with PDO MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Verify MariaDB installer, private hosted runner and engine snapshot contracts
        env:
          STAGE3_INSTALL_MYSQL_HOST: 127.0.0.1
          STAGE3_INSTALL_MYSQL_PORT: 3306
          STAGE3_INSTALL_MYSQL_USER: root
          STAGE3_INSTALL_MYSQL_PASSWORD: stage3-ci-root
        run: |
          php -l stage3/server/DatabaseServerCompatibility.php
          php -l stage3/server/bin/Stage3Installer.php
          php -l stage3/server/DatabaseSnapshot.php
          node --check stage3/tests/mysql-install-probe.cjs
          node stage3/tests/mysql-install-probe.cjs
          node stage3/tests/engine-update-smoke.cjs
