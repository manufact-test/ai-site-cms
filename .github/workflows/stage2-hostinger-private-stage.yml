name: Stage2 Hostinger offweb CMS package (public-source, NO HOST DEPLOY)
# Automatically publish the built, credential-free CMS package into a separate
# Git branch ONLY AFTER the full editor/package workflow succeeded on main.
# This does not deploy to Hostinger. Never connect this branch to public_html.
# The source repository is intentionally allowed to remain PUBLIC by owner.
on:
  workflow_run:
    workflows: ['Stage 2 static Jedison editor (internal CI only)']
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact full 40-char SHA of current main
        type: string
        required: true
      approval:
        description: Type STAGE_PUBLIC_SOURCE_OFFWEB_ONLY
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: stage2-hostinger-offweb-cms
  cancel-in-progress: false
jobs:
  publish-inactive-offweb-package:
    if: >-
      github.repository == 'manufact-test/ai-site-cms' &&
      (
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
        ||
        (github.event_name == 'workflow_dispatch' &&
         github.ref == 'refs/heads/main' &&
         inputs.approval == 'STAGE_PUBLIC_SOURCE_OFFWEB_ONLY')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact successful or manually approved main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Enforce current main SHA, branch, and permission before building
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_KIND: ${{ github.event_name }}
          VALIDATED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          MANUAL_SHA: ${{ inputs.source_sha }}
          MANUAL_APPROVAL: ${{ inputs.approval }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == manufact-test/ai-site-cms ]]
          [[ "$VALIDATED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$VALIDATED_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" == "$VALIDATED_SHA" ]]
          if [[ "$EVENT_KIND" == workflow_dispatch ]]; then
            [[ "$MANUAL_APPROVAL" == STAGE_PUBLIC_SOURCE_OFFWEB_ONLY ]]
            [[ "$MANUAL_SHA" == "$VALIDATED_SHA" ]]
          fi
          echo 'Authorized current main source; no hosting operations.'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium,pdo_mysql,pdo_sqlite
          tools: composer:v2
          coverage: none
      - name: Build locked vendor and deterministic editor, verify sanitised package
        working-directory: cms
        run: |
          set -euo pipefail
          # Composer must not invent a new root version for every CI commit.
          # The real Stage2 source-bound package version is release.json.
          export COMPOSER_ROOT_VERSION="$(node -p "require('./release.json').version")"
          [[ "$COMPOSER_ROOT_VERSION" =~ ^0\.[0-9]+\.[0-9]+-stage2\.[0-9]+$ ]]
          composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader
          npm ci --prefix editor --no-audit --no-fund
          npm run build --prefix editor
          node tools/build-internal-package.cjs
          node tools/test-stage2-hostinger-private-stage.cjs
          node tools/test-stage2-offweb-publication-contract.cjs
      - name: Stage exact non-webroot Git tree (no production activation)
        working-directory: cms
        env:
          CMS_STAGE2_STAGING_APPROVED: inactive-stage2-package-only
        run: node tools/stage2-hostinger-private-stage.cjs --prepare "$RUNNER_TEMP/private-runtime"
      - name: Rehearse exact ZIP extraction, including Apache .htaccess
        shell: bash
        run: |
          set -euo pipefail
          python3 cms/tools/test-stage2-offweb-upload.py "$RUNNER_TEMP/private-runtime"
          python3 cms/tools/test-stage2-offweb-upload-fixtures.py "$RUNNER_TEMP/private-runtime"
      - name: Publish downloadable credential-free Hostinger offweb archive
        uses: actions/upload-artifact@v4
        with:
          name: stage2-hostinger-offweb-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          path: ${{ runner.temp }}/private-runtime/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Download the ACTUAL uploaded archive and extract on a new private path
        uses: actions/download-artifact@v4
        with:
          name: stage2-hostinger-offweb-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          path: ${{ runner.temp }}/returned/private-runtime
      - name: Byte-for-byte compare PUBLISHED archive to inspected staging tree
        shell: bash
        run: |
          set -euo pipefail
          python3 cms/tools/test-stage2-upload-roundtrip.py \
            "$RUNNER_TEMP/private-runtime" \
            "$RUNNER_TEMP/returned/private-runtime" \
            > "$RUNNER_TEMP/stage2-offweb-roundtrip-evidence.json"
          python3 cms/tools/test-stage2-upload-roundtrip-fixtures.py \
            "$RUNNER_TEMP/private-runtime"
          python3 - "$RUNNER_TEMP/stage2-offweb-roundtrip-evidence.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          e=json.loads(Path(sys.argv[1]).read_text())
          assert e['result']=='downloaded-artifact-exact-byte-match'
          assert e['filesComparedExactly']>=470
          assert e['hostingTouched'] is False and e['databaseTouched'] is False
          assert e['stage2Accepted'] is False and e['productionReady'] is False
          assert e['publisherSignatureVerified'] is False
          print('Stage2 published archive REVERIFIED:', e['filesComparedExactly'], 'files; manifest', e['manifestSha256'])
          PY
      - name: Publish nonsecret archive verification evidence (NOT a signature)
        uses: actions/upload-artifact@v4
        with:
          name: stage2-offweb-return-verification-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          path: ${{ runner.temp }}/stage2-offweb-roundtrip-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish only dedicated, never-webroot, source-public branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$VALIDATED_SHA" == "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" ]]
          branch=stage2-hostinger-offweb-runtime
          dst="$RUNNER_TEMP/stage2-offweb-git"
          mkdir -m 700 "$dst"
          git init -q "$dst"
          git -C "$dst" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          gh auth setup-git
          if git -C "$dst" ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
            git -C "$dst" fetch -q --depth=1 origin "refs/heads/$branch"
            git -C "$dst" checkout -q -b "$branch" FETCH_HEAD
            find "$dst" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          else
            git -C "$dst" checkout -q --orphan "$branch"
          fi
          cp -a "$RUNNER_TEMP/private-runtime/." "$dst/"
          git -C "$dst" add --all
          # A source-only test/probe change may produce the EXACT same package.
          # No-op must be successful and must NOT create meaningless commits or
          # force a Hostinger deployment.
          if git -C "$dst" diff --cached --quiet; then
            echo 'Identical verified package; keep existing deployment branch SHA.'
          else
            git -C "$dst" -c user.name=ai-site-cms-stage2 \
              -c user.email=actions@users.noreply.github.com \
              commit -qm "stage2: offweb inactive CMS package from $VALIDATED_SHA"
            [[ "$VALIDATED_SHA" == "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" ]]
            git -C "$dst" push -q origin "HEAD:refs/heads/$branch"
            echo 'Compiled dependency-complete public-source branch updated safely.'
          fi
          echo 'Never choose this branch for public_html. No Hostinger, DB or SSH touched.'
