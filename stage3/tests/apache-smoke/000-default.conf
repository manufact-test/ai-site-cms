<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/stage3/server/public

    <Directory /var/www/stage3/server/public>
        Options -Indexes -MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
