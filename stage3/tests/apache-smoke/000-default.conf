<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/domain/public_html

    <Directory /var/www/domain/public_html>
        Options -Indexes -MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
